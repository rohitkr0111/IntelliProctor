services:
  - type: web
    name: intelliproctor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT backend.app:app
    healthCheckPath: /api/assessment/questions
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8